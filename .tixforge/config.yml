# tixforge settings (shared, committed)
language: ja
commands:
  typecheck: pnpm typecheck
  lint: pnpm lint
  test: pnpm test
  build: pnpm build
ticket:
  tracker: github
repository:
  host: github
  base_branch: develop
  close_issues: release
review:
  required: false
gates: [approach, plan, pr]
